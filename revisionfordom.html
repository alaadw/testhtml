<!DOCTYPE html>
<html>
<head>
    <title>DOM Revision</title>
</head>
<body>
<!-- for revision -->
 <!-- Methods for Doms : The getElementById Method -->
<!-- document.getElementById(id)	Find an element by element id
document.getElementsByTagName(name)	Find elements by tag name
document.getElementsByClassName(name)	Find elements by class name-->
<div id="container">
    <h1>Hello, World!</h1>
    <p>This is a paragraph.</p>
    <p class="text">This is another paragraph with class "text".</p>
    <p class="text">This is yet another paragraph with class "text".</p>

</div>
<script>
    // Using getElementById to change the text of the h1 element
    var header = document.getElementById("container").getElementsByTagName("h1")[0];
    header.textContent = "Hello, DOM!";

    // Using getElementsByTagName to change the text of all paragraph elements
    var paragraphs = document.getElementById("container").getElementsByTagName("p");
    for (var i = 0; i < paragraphs.length; i++) {
        paragraphs[i].textContent += " (Modified)";
    }

    // Using getElementsByClassName to change the text of elements with class "text"
    var textElements = document.getElementById("container").getElementsByClassName("text");
    for (var j = 0; j < textElements.length; j++) {
        textElements[j].textContent += " (Class Modified)";
    }
    </script>
</body>
</html>
