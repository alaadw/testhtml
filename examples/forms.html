<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Examples</title>
</head>
<body>
    <h1>HTML Form Examples</h1>
    
    <h2>Basic Contact Form</h2>
    <form>
        <fieldset>
            <legend>Personal Information</legend>
            
            <label for="firstName">First Name:</label><br>
            <input type="text" id="firstName" name="firstName" required><br><br>
            
            <label for="lastName">Last Name:</label><br>
            <input type="text" id="lastName" name="lastName" required><br><br>
            
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>
            
            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
            
            <label for="birthday">Birthday:</label><br>
            <input type="date" id="birthday" name="birthday"><br><br>
        </fieldset>
        
        <fieldset>
            <legend>Preferences</legend>
            
            <label for="country">Country:</label><br>
            <select id="country" name="country">
                <option value="">Select a country</option>
                <option value="us">United States</option>
                <option value="uk">United Kingdom</option>
                <option value="ca">Canada</option>
                <option value="au">Australia</option>
            </select><br><br>
            
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br>
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Other</label><br><br>
            
            <label>Interests:</label><br>
            <input type="checkbox" id="sports" name="interests" value="sports">
            <label for="sports">Sports</label><br>
            <input type="checkbox" id="music" name="interests" value="music">
            <label for="music">Music</label><br>
            <input type="checkbox" id="reading" name="interests" value="reading">
            <label for="reading">Reading</label><br><br>
        </fieldset>
        
        <fieldset>
            <legend>Message</legend>
            <label for="subject">Subject:</label><br>
            <input type="text" id="subject" name="subject"><br><br>
            
            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="50" placeholder="Enter your message here..."></textarea><br><br>
        </fieldset>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    
    <hr>
    
    <h2>Different Input Types</h2>
    <form>
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password"><br><br>
        
        <label for="number">Age (1-120):</label><br>
        <input type="number" id="number" name="age" min="1" max="120"><br><br>
        
        <label for="range">Volume:</label><br>
        <input type="range" id="range" name="volume" min="0" max="100"><br><br>
        
        <label for="color">Favorite Color:</label><br>
        <input type="color" id="color" name="color"><br><br>
        
        <label for="url">Website:</label><br>
        <input type="url" id="url" name="website" placeholder="https://example.com"><br><br>
        
        <label for="search">Search:</label><br>
        <input type="search" id="search" name="search" placeholder="Search..."><br><br>
        
        <input type="hidden" name="formId" value="contactForm">
        
        <button type="submit">Submit Form</button>
    </form>
</body>
</html>
