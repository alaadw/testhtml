<!DOCTYPE html>
<html>
<body>

<h2>JavaScript Timing</h2>

<p>A script on this page starts this clock:</p>

<p id="demo"></p>

<script>
    // every second it will call myTimer function
    // after every 3 second it will call myTimer function
    // interval means after every specific time it will call function
setInterval(myTimer, 3000);

function myTimer() {
  const d = new Date(); // will get date and time
  document.getElementById("demo").innerHTML = d.toLocaleTimeString();
}
</script>

</body>
 

</html>
